[project]
name = "btc5m-polymarket-model"
version = "0.1.0"
description = "Research toolkit for BTCUSD Polymarket Up/Down 5m probability, edge and exit models"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "requests>=2.31.0",
    "playwright>=1.45.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
]

[project.scripts]
btc5m-monitor = "btc5m.run_live_monitor:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
